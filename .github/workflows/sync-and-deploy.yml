name: Sync Telemetry & Deploy Pages

on:
  schedule:
    # Run off-peak hourly at :15 UTC after finalized UTC hour rollup
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: telemetry-data-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout telemetry data repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Load existing snapshot from data branch
        id: load_data
        run: |
          rc=0
          ls_out=$(git ls-remote --exit-code --heads origin refs/heads/data 2>&1) || rc=$?
          if [ "$rc" -eq 0 ]; then
            git fetch --depth=1 origin +refs/heads/data:refs/remotes/origin/data
            old_oid=$(git rev-parse refs/remotes/origin/data)
            mkdir -p _data
            git archive refs/remotes/origin/data | tar -x -C _data
          elif [ "$rc" -eq 2 ]; then
            old_oid=""
          else
            echo "$ls_out" >&2
            exit "$rc"
          fi
          mkdir -p _data/data
          echo "old_oid=${old_oid}" >> "$GITHUB_OUTPUT"

      - name: Sync closed hourly telemetry rollups
        id: sync
        env:
          DATA_DIR: ${{ github.workspace }}/_data/data
          TELEMETRY_BASE_URL: ${{ vars.TELEMETRY_BASE_URL }}
          TELEMETRY_API_TOKEN: ${{ secrets.TELEMETRY_API_TOKEN }}
        run: bun run scripts/sync.ts

      - name: Rewrite data branch as single orphan snapshot commit
        if: steps.sync.outputs.changed == 'true'
        run: |
          rm -rf _stage
          mkdir -p _stage
          cp -r _data/data _stage/data
          rm -f _stage/data/.gitkeep

          tmp_index=$(mktemp)
          rm -f "$tmp_index"
          trap 'rm -f "$tmp_index"; rm -rf _stage' EXIT

          tree=$(
            export GIT_INDEX_FILE="$tmp_index"
            export GIT_WORK_TREE="${PWD}/_stage"
            git add -A -f -- "${GIT_WORK_TREE}"
            git write-tree
          )

          old_tree=""
          if git rev-parse --verify -q 'refs/remotes/origin/data^{tree}' >/dev/null 2>&1; then
            old_tree=$(git rev-parse 'refs/remotes/origin/data^{tree}')
          fi
          if [ -n "$old_tree" ] && [ "$tree" = "$old_tree" ]; then
            echo "Snapshot tree unchanged; skipping force-push."
            exit 0
          fi

          commit=$(
            GIT_AUTHOR_NAME="github-actions[bot]" \
            GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            GIT_COMMITTER_NAME="github-actions[bot]" \
            GIT_COMMITTER_EMAIL="41898282+github-actions[bot]@users.noreply.github.com" \
            git commit-tree "$tree" -m "chore(data): sync hourly telemetry rollup"
          )

          old_oid="${{ steps.load_data.outputs.old_oid }}"
          if [ -n "$old_oid" ]; then
            git push --force-with-lease="refs/heads/data:${old_oid}" origin "${commit}:refs/heads/data"
          else
            git push --force-with-lease="refs/heads/data:" origin "${commit}:refs/heads/data"
          fi

      - name: Checkout antigravity-status web app
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: united-magic-association/antigravity-status
          path: _app

      - name: Build static dashboard with bundled data
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          cd _app/web
          bun install --frozen-lockfile || bun install
          bun run build
          rm -rf dist/data
          cp -r ../../_data/data dist/data

      - name: Upload Pages artifact
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _app/web/dist

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
